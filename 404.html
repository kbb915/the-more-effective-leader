<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#17334f">
  <title>Page Not Found | The More Effective Leader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f7f4ec;--navy:#17334f;--slate:#4e5d69;--rust:#a54829;--line:#d5dce1}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:40px 24px;background:var(--paper);color:var(--navy);font-family:'DM Sans',sans-serif;text-align:center}
    main{width:min(720px,100%)}
    .logo{width:min(470px,88vw);height:auto;margin:0 auto 48px}
    .rule{width:58px;height:3px;margin:0 auto 26px;background:var(--rust)}
    .error{margin:0 0 12px;color:var(--rust);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0 0 18px;font:400 clamp(40px,7vw,66px)/1.05 'Libre Caslon Display',Georgia,serif;letter-spacing:-.035em}
    p{max-width:560px;margin:0 auto 30px;color:var(--slate);font-size:18px;line-height:1.65}
    a{display:inline-flex;min-height:50px;align-items:center;justify-content:center;padding:0 24px;border:1px solid var(--navy);background:var(--navy);color:white;font-size:12px;font-weight:700;letter-spacing:.08em;text-decoration:none;text-transform:uppercase}
    a:hover{filter:brightness(1.12)}
    a:focus-visible{outline:3px solid var(--rust);outline-offset:4px}
    @media(max-width:620px){body{padding:32px 20px}.logo{margin-bottom:38px}p{font-size:17px}a{width:100%}}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/the-more-effective-leader-logo.png" alt="The More Effective Leader">
    <div class="rule" aria-hidden="true"></div>
    <p class="error">Error 404</p>
    <h1>This Page Couldn’t Be Found.</h1>
    <p>The page may have moved or the address may be incorrect. Return to The More Effective Leader homepage to continue.</p>
    <a href="/">Return to the Homepage</a>
  </main>
</body>
</html>
